<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Tyrone Dunn</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e3dfd6">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<script>try{if(localStorage.getItem('td-motion')==='off')document.documentElement.classList.add('rm')}catch(e){}</script>
<style>
@font-face{font-family:'Archivo';src:url('/fonts/archivo-var.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box;margin:0}
html{background:#e3dfd6;color:#151412}
body{min-height:100svh;display:grid;place-items:center;padding:32px 20px;font:400 17px/1.55 'Archivo',Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(640px,100%)}
.k{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#704f2e;margin-bottom:18px;font-weight:600}
h1{font-family:'Archivo','Arial Narrow',Arial,sans-serif;font-weight:800;font-size:clamp(40px,10vw,84px);line-height:.98;letter-spacing:-.01em;text-wrap:balance}
p{margin-top:20px;max-width:34em;opacity:.78;text-wrap:pretty}
a{display:inline-flex;align-items:center;gap:10px;margin-top:32px;min-height:48px;padding:0 24px;border-radius:999px;background:#151412;color:#e3dfd6;font-weight:600;text-decoration:none;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
a:hover{transform:translateY(-2px)}
a:focus-visible{outline:2px solid #704f2e;outline-offset:3px}
a span{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
a:hover span{transform:translateX(-4px)}
.r{opacity:0;transform:translateY(22px);animation:up .8s cubic-bezier(.16,1,.3,1) forwards}
.r:nth-child(2){animation-delay:.08s}.r:nth-child(3){animation-delay:.16s}.r:nth-child(4){animation-delay:.24s}
@keyframes up{to{opacity:1;transform:none}}
.rm .r{opacity:1;transform:none;animation:none}
</style>
</head>
<body>
<main>
<span class="k r">Error 404</span>
<h1 class="r">This page isn’t here.</h1>
<p class="r">The link is old or the address has a typo. Head back and pick up where you left off.</p>
<a class="r" href="/"><span aria-hidden="true">&larr;</span>Back to the portfolio</a>
</main>
</body>
</html>
